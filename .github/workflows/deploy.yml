name: Deploy Climatica

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Update source
        run: |
          cd /home/guiveg/climatica-nextjs
          git pull origin main

      - name: Install dependencies
        run: |
          cd /home/guiveg/climatica-nextjs
          npm ci

      - name: Build application
        run: |
          cd /home/guiveg/climatica-nextjs
          npm run build

      - name: Restart service
        run: |
          sudo systemctl restart climatica

      - name: Check service
        run: |
          sudo systemctl status climatica --no-pager
